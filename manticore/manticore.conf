# Manticore Search Configuration

searchd
{
    listen = 9306:mysql41
    listen = 9312:http
    listen = 9308:http
    log = /var/log/manticore/searchd.log
    query_log = /var/log/manticore/query.log
    pid_file = /var/run/manticore/searchd.pid
    binlog_path = /var/lib/manticore/binlog
}

index documents
{
    type = rt
    path = /var/lib/manticore/documents
    rt_field = title
    rt_field = content
    rt_attr_timestamp = date_added
    
    # Define morphology and charset
    morphology = stem_en
    min_word_len = 1
    charset_type = utf-8
    min_prefix_len = 1
    enable_star = 1
    ngram_len = 1
    ngram_chars = U+41..U+5A, U+61..U+7A, U+C0..U+FF, U+400..U+4FF
}

indexer
{
    mem_limit = 128M
}