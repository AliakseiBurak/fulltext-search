source main
{
    type = pgsql
    sql_host = db
    sql_user = user
    sql_pass = password
    sql_db = mydatabase
    sql_port = 5432

    # SQL query to fetch documents for indexing
    sql_query = SELECT id, title, content, category FROM documents
    sql_attr_uint = category
}

index main
{
    source = main
    path = /var/lib/manticore/data/main
    docinfo = extern
    charset_type = utf-8
    min_word_len = 1
    min_prefix_len = 3
    enable_star = 1
    ngram_len = 1
    ngram_chars = U+41..U+5A, U+61..U+7A, U+0410..U+042F, U+0430..U+044F
}

indexer
{
    mem_limit = 128M
}

searchd
{
    listen = 9312
    listen = 9306:mysql41
    log = /var/log/manticore/searchd.log
    query_log = /var/log/manticore/query.log
    pid_file = /var/run/manticore/searchd.pid
    binlog_path = /var/lib/manticore/binlog
}